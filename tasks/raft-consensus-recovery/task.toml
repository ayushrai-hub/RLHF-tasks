summary = "Repair a Node.js Raft forensic replay engine that must triage mixed WAL and RPC artifacts and virtual-remediate a split-brain consensus outage across a five-node cluster."
expert_time_estimate_min = 420
expert_time_estimate_hours = 7.0
junior_time_estimate_min = 840
difficulty_explanation = "Five interacting Raft defects (vote log comparison, prior-term commit safety, quorum term filtering, partition overlap detection, WAL endianness) sit behind misleading election-timeout and snapshot signals. Twenty-tier rejection priority spans node-id smuggling, term overflow, log gaps, RPC ordering, homoglyph cluster IDs, snapshot conflicts, commit regression, and stress cases that reject quadratic replays."
solution_explanation = "The oracle replaces normalization, WAL and RPC parsing, election and append safety, quorum counting, partition handling, simulation, triage, and report generation so recovery artifacts are computed from evidence without mutating golden config files."
verification_explanation = "Pytest generates valid, malformed, order-varied, cross-correlated, and stress partition bundles, runs the public CLI, validates strict JSON, CSV, and text artifacts, checks layered failure priority ordering, exercises linearizability invariants, and verifies config files remain unchanged."

