[package]
name = "wavebench-vis"
version = "0.1.3"
edition = "2021"
description = "Visualisation helpers for WaveBench simulation outputs"

[dependencies]
wavebench-core     = { path = "../wavebench-core", default-features = false }
wavebench-adaptive = { path = "../wavebench-adaptive", optional = true, default-features = false }
plotters           = { version = "0.3.5", optional = true }

[features]
default = []
plot = ["dep:plotters"]

lax-wendroff-vis = [
    "dep:wavebench-adaptive",
    "wavebench-adaptive/lax-wendroff",
    "wavebench-core/adaptive-cfl",
]

adaptive-preview = ["wavebench-core/adaptive-cfl", "wavebench-adaptive?/weno5"]

guarded-vis = [
    "dep:wavebench-adaptive",
    "wavebench-adaptive?/tvd-limiter",   # strong dep above makes this fire
    "wavebench-core/experimental",
]
