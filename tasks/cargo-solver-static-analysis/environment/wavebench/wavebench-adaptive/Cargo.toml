[package]
name = "wavebench-adaptive"
version = "0.3.1"
edition = "2021"
description = "Adaptive-timestep CFL controllers for WaveBench"

[dependencies]
num-traits = "0.2.18"

[features]
default = []
rk4 = []
lax-wendroff = []
tvd-limiter = ["rk4"]
weno5 = [
    "tvd-limiter",
]
high-order = ["weno5"]

# Mixed limiter scheme: engages both the lax-wendroff and TVD limiters.
mixed-scheme = [
    "lax-wendroff",
    "tvd-limiter",
]
