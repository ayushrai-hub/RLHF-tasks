# Task configuration schema version
version = "2.0"

# Task metadata
[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "debugging"
# Subcategories: "long_context", "tool_specific", "api_integration", "db_interaction", "ui_building"
subcategories = ["tool_specific"]
number_of_milestones = 0
# Codebase size: minimal -> 0-20 files, small -> 20+ files, large -> 200+ files
codebase_size = "small"
languages = ["java"]
tags = ["java", "cron", "scheduling", "datetime", "cli", "debugging"]
expert_time_estimate_min = 75
junior_time_estimate_min = 240

# Verifier
[verifier]
timeout_sec = 600.0

# Agent
[agent]
timeout_sec = 1800.0

# Sandbox environment
[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
allow_internet = false
