[package]
name = "sentiment-infer"
version = "4.3.1"
edition = "2021"
description = "CPU inference crate for the sentiment-transformer text classifier"
license = "Apache-2.0"

[features]
default = ["cpu-avx2", "quantized-int8", "dynamic-batching", "telemetry"]
cpu-avx2 = []
gpu-cuda = []
quantized-int8 = []
quantized-bf16 = []
dynamic-batching = []
telemetry = []
experimental-simd = []

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_yaml = "0.9.34"
toml = "0.8.14"
anyhow = "1.0.86"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "throughput"
harness = false
