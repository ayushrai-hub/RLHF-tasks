# Crate serving configuration.
# The declared ceilings here are the hard caps referenced by the release process.
# The quantization.mode field below is a leftover from the abandoned GPU trial.

[serving]
max_batch_size = 16
max_concurrency = 16
request_timeout_ms = 2000

[quantization]
mode = "bf16"

[thresholds]
min_accuracy = 0.90
max_latency_ms = 60
