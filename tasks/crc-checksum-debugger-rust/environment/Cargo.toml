[package]
name = "relay-audit"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "relay-audit"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=0.8.23"
clap = { version = "=4.5.37", features = ["derive"] }
