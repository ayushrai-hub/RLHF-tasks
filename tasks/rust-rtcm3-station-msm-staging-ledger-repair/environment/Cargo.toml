[package]
name = "rtcmctl"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "=0.4.38", features = ["serde"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
sha2 = "=0.10.8"
uuid = { version = "=1.8.0", features = ["v4"] }
