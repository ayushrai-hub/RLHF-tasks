# Task configuration schema version
version = "2.0"

# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "data-processing"
# Options for subcategories are: "long_context", "tool_specific", "api_integration", "db_interaction", "ui_building"
subcategories = []
# Total milestone count - must match the number of [[steps]] blocks below
number_of_milestones = 4
# Size of the codebase: minimal -> 0-20 files, small -> 20+ files, large -> 200+ files
# environment/ holds only the verifier lockfile, requirements.in and dockerignore; the task is self-contained.
codebase_size = "minimal"
# Coding languages used in the oracle solution or required by the agent
languages = ["python"]
# 3-6 keywords describing the task
tags = ["dom", "layout", "viewport", "binary-encoding", "serialization"]
# Estimated time to complete (minutes)
expert_time_estimate_min = 200
junior_time_estimate_min = 400

# Sandbox environment limits - applied across all milestones (the same container is shared)
[environment]
allow_internet = false
# Generous build headroom: the image is small, but a slow/flaky remote builder
# can occasionally need more than 15 minutes to finish before the agent starts.
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"

# Milestone 1 - absolute border boxes through the nested box model
[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0

# Milestone 2 - overflow and viewport clipping into visible rectangles
[[steps]]
name = "milestone_2"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0

# Milestone 3 - ordered interactive snapshot records
[[steps]]
name = "milestone_3"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0

# Milestone 4 - checksummed binary snapshot frame
[[steps]]
name = "milestone_4"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0
