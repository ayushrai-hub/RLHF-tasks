version = "2.0"

[metadata]
author_name = "Terminal Bench"
author_email = "benchmark@terminal.dev"
difficulty = "hard"
category = "debugging"
subcategories = ["api_integration"]
tags = ["go", "rest-api", "debugging", "http", "workflow"]
languages = ["go"]
expert_time_estimate_min = 120.0
junior_time_estimate_min = 1200.0
codebase_size = "minimal"
number_of_milestones = 0
task_subtypes = ["API Integration"]

[verifier]
# pytest is bounded at 120 s and the race gate at 150 s (270 s of bounded work)
# plus the agent-code `go build` and startup; 360 s left too little headroom and
# intermittently tripped "verifier_did_not_run" when the host was loaded. 600 s
# comfortably covers the bounded inner work plus build/startup overhead.
timeout_sec = 600.0

[agent]
# This is a multi-bug debugging task (race-clean Go build + 70 tests, including
# the subtle revoke-rollback) with a 120-min expert estimate; 1200 s (20 min)
# was far too tight and most failed trials simply ran out of time mid-fix.
# 1800 s (30 min) is the Harbor hard cap for agent.timeout_sec and the most
# headroom allowed.
timeout_sec = 1800.0

[environment]
allow_internet = false
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 5120
