[package]
name = "warm"
version = "0.0.1"
edition = "2021"

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
parking_lot = "=0.12.3"
sha2 = "=0.10.8"
hex = "=0.4.3"
