# Task configuration schema version
version = "2.0"

# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "Justin"
author_email = "justins.dev.email.0@gmail.com"
difficulty = "hard"
category = "games"
# Options for subcategories are: "long_context", "tool_specific", "api_integration", "db_interaction", "ui_building"
subcategories = ["long_context", "tool_specific"]
# Total milestone count — must match the number of [[steps]] blocks below
number_of_milestones = 3
# Size of the codebase: minimal -> 0-20 files, small -> 20+ files, large -> 200+ files
# 'small': environment/ holds 26 files (excl. Dockerfile) once the pip wheels are
# vendored under vendor/wheels/ for the offline build, which crosses the 20-file band.
codebase_size = "small"
# Coding languages used in the oracle solution or required by the agent
languages = ["python", "c"]
# For tool_specific, api_integration, and db_interaction subcategories, include the specific tool / framework / database
tags = ["polars", "parquet", "c", "ncurses", "make", "sha256", "binary-format"]
# Estimated time to complete (minutes)
expert_time_estimate_min = 150
junior_time_estimate_min = 300

# Sandbox environment limits — applied across all milestones (the same container is shared)
[environment]
allow_internet = false
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"

# Milestone 1 — Decode Archive Schema
# Complete the Polars migration harness so `migrate.py schema` writes the
# canonical /app/out/schema_report.json described in chronicle Appendix I.
[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0

# Milestone 2 — Migrate Puzzle Database
# Complete the harness so `migrate.py pack` writes the little-endian
# /app/out/vault.pack image described in chronicle Appendices II-III.
[[steps]]
name = "milestone_2"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0

# Milestone 3 — Integrate Terminal Expedition
# Extend and compile the C engine so it replays the scripted expedition over
# vault.pack and writes /app/out/transcript.txt per chronicle Appendix IV.
[[steps]]
name = "milestone_3"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0
