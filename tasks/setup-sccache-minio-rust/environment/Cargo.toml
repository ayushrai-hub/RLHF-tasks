[workspace]
members = [
    "crates/meridian-core",
    "crates/meridian-proto",
    "crates/meridian-api",
    "crates/meridian-sync",
    "crates/meridian-macros",
    "crates/meridian-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
sha2 = "0.10.9"
hex = "0.4.3"
clap = { version = "4.5.53", features = ["derive"] }
