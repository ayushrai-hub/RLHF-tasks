[package]
name = "nfa_verify"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nfa_verify"
path = "src/main.rs"

[dependencies]
nfa_parse = { path = "../../parse" }
nfa_aggregate = { path = "../../aggregate" }
nfa_classify = { path = "../../classify" }
nfa_emit = { path = "../../emit" }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
