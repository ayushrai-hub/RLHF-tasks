# Task configuration schema version
version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "security"
subcategories = ["long_context", "db_interaction"]
number_of_milestones = 0
codebase_size = "minimal"
languages = ["go"]
tags = ["mlflow", "yaml", "toml", "sqlite", "governance"]
expert_time_estimate_min = 120
junior_time_estimate_min = 240

[verifier]
timeout_sec = 900

[agent]
timeout_sec = 1800

[environment]
allow_internet = false
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"
