experiments:
  - id: exp-alpha
    stage: staging
    artifacts:
      public_read: true
      stores:
        - name: primary
          public_read: true
        - name: audit
          public_read: false
    retention:
      override: false
      class: standard-90d
    governance:
      quarantine: false
  - id: exp-beta
    artifacts:
      public_read: true
    retention:
      override: false
  - id: exp-gamma
    artifacts:
      public_read: false
    retention:
      override: false
  - id: exp-quarantine
    artifacts:
      public_read: false
    governance:
      quarantine: true
