tracking:
  uri: "https://admin:pass!@track.atlasbench.internal:8443/mlflow?trace=1#frag"
  servers:
    - name: ipv6
      uri: "https://admin:secret@[2001:db8::5]:8443/mlflow"
    - name: env-ready
      uri: "https://admin:env:EXISTING@track.atlasbench.internal/mlflow"
    - name: no-pass
      uri: "https://track.atlasbench.internal/mlflow"
    - name: ftp-bad
      uri: "ftp://admin:secret@legacy.internal/data"
    - name: unmapped
      uri: "https://unknown:secret@other.example.com/v1"
  experiments:
    - id: exp-uri
      retention:
        override: false
