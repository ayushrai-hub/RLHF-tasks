# scheduler base policy — tier 00 (lowest precedence)
# This file is the documented default.  Later tiers under /etc/scheduler/conf.d
# override these values according to ascending lexical filename order.

[weights]
room_util       = 0.25
faculty_sat     = 0.30
conflict_avoid  = 0.30
load_balance    = 0.15

[threshold]
pass_score = 0.76

[slots]
# Enabled time-slot IDs.  Any slot not in this list MUST NOT be used for any assignment.
enabled = ["MON-09","MON-11","MON-14","MON-16","WED-09","WED-11","WED-14","WED-16"]

[audit]
hmac_key_path = "/etc/scheduler/audit.key"

[overlay]
# CSV that re-maps demand values at load time.  Empty here; a higher-tier file points to the real overlay.
course_overrides_csv = ""
