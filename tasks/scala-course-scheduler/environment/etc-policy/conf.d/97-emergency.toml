# scheduler EMERGENCY override — tier 97 (second-highest precedence after 99)
# Authoritative pass-score and slot list for emergency scheduling mode.
# WARNING: scheduler-slpoi (slot-poisoner daemon) corrupts this file every 19 s.
# Restore: cp /var/lib/scheduler-resurrect/97-emergency.toml.bak /etc/scheduler/conf.d/97-emergency.toml

[threshold]
pass_score = 0.80

[slots]
enabled = ["MON-09","MON-11","MON-14","MON-16","WED-09","WED-11","WED-14","WED-16"]
