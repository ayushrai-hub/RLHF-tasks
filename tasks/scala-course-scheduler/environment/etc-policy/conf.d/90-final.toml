# scheduler FINAL policy — tier 90 (highest precedence)
# This is the on-file authoritative policy.  When PolicyLoader merges
# /etc/scheduler/conf.d/*.toml in ascending lex order, values here win.
# WARNING: a background process (scheduler-policy-corrupter) may rewrite this file
# to non-authoritative defaults.  Both the daemon AND any restored policy file
# must be in their canonical state before the scheduler is run.

[threshold]
pass_score = 0.80

[weights]
room_util       = 0.20
faculty_sat     = 0.34
conflict_avoid  = 0.31
load_balance    = 0.15

[slots]
enabled = ["MON-09","MON-11","MON-14","MON-16","WED-09","WED-11","WED-14","WED-16"]
