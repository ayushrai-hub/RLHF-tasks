# Task configuration schema version
version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "security"
subcategories = [ "tool_specific" ]
number_of_milestones = 6
codebase_size = "small"
languages = [ "objective-c", "python", "xml" ]
tags = [ "objective-c", "plist", "entitlements", "code-signing", "json-policy" ]
expert_time_estimate_min = 120
junior_time_estimate_min = 240

[environment]
allow_internet = false
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"

