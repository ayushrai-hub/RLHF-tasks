version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "medium"
category = "machine-learning"
subcategories = ["tool_specific", "api_integration"]
codebase_size = "small"
languages = ["typescript"]
tags = ["multi-step", "machine-learning", "evaluation", 
		"mlflow", "onnx", "fastify"]
number_of_milestones = 2

# Estimated time to complete (minutes)
expert_time_estimate_min = 60
junior_time_estimate_min = 120

[environment]
build_timeout_sec = 600.0
allow_internet = false
cpus = 4
memory_mb = 6144
storage_mb = 10240
workdir = "/app"


# List of steps
[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1800

[steps.verifier]
timeout_sec = 450.0


[[steps]]
name = "milestone_2"

[steps.agent]
timeout_sec = 1800

[steps.verifier]
timeout_sec = 450.0
