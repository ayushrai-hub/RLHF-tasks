[hash]
algorithm = "sha256"
buffer_size = 8192
parallel = true
verify_writes = false

[scan]
min_size = 1
max_size = 9223372036854775807
follow_symlinks = false
skip_hidden = true
exclude_patterns = []

[dedup]
keep_strategy = "newest"
hardlink = false
symlink = false
always_dry_run = false

[report]
format = "detailed"
include_hashes = true
verbose_summary = false
