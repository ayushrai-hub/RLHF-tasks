[package]
name = "file-deduplicator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
clap = { version = "=4.6.1", features = ["derive"] }
toml = "=0.8.23"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
md-5 = "=0.10.6"
hex = "=0.4.3"
walkdir = "=2.5.0"
rayon = "=1.12.0"
chrono = { version = "=0.4.45", features = ["serde"] }

[profile.release]
opt-level = 2
