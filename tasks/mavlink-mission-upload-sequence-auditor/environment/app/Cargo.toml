[package]
name = "mission-audit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mission-ingest"
path = "src/bin/mission_ingest.rs"

[[bin]]
name = "mission-export"
path = "src/bin/mission_export.rs"

[[bin]]
name = "serde-f64-fmt"
path = "src/bin/serde_f64_fmt.rs"

[dependencies]
clap = { version = "4.5.27", features = ["derive"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
hex = "0.4.3"
