[contract]
version = 1

[[surfaces]]
path = "/app/output/gradient_report.json"
kind = "json"
description = "Run summary with per-graph gradients, loss values, fd deltas, digests"

[[surfaces]]
path = "/app/output/node_trace.csv"
kind = "csv"
description = "Per-node forward values and backward sensitivities"

[[surfaces]]
path = "/app/output/pass_journal.jsonl"
kind = "jsonl"
description = "Ordered pass records with epoch and pool checksum"

[[surfaces]]
path = "/app/var/grad/session.json"
kind = "json"
description = "Persistent session counters and last fingerprint"

[[surfaces]]
path = "/app/var/grad/pool_state.json"
kind = "json"
description = "Gradient accumulator pool keyed by variable name"

[[surfaces]]
path = "/app/var/grad/tape_epoch.json"
kind = "json"
description = "Tape epoch ledger for pool invalidation between passes"

[[surfaces]]
path = "/app/var/grad/checkpoint.json"
kind = "json"
description = "Run waterline and fingerprint for cross-run persistence"
