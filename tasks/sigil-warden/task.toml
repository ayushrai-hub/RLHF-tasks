# Task configuration schema version
version = "2.0"

# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "security"
# Options for subcategories are: "long_context", "tool_specific", "api_integration", "db_interaction", "ui_building"
subcategories = []
# Total milestone count — must match the number of [[steps]] blocks below
number_of_milestones = 4
# Size of the codebase: minimal -> 0-20 files, small -> 20+ files, large -> 200+ files.
codebase_size = "minimal"
# Coding languages used in the oracle solution or required by the agent
languages = ["go", "bash"]
tags = ["capability-tokens", "hmac", "length-extension", "authorization", "reverse-engineering"]
# Estimated time to complete (minutes)
expert_time_estimate_min = 120
junior_time_estimate_min = 300

# Sandbox environment limits — applied across all milestones
[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"
allow_internet = false

# Milestone 1 — verify
[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0

# Milestone 2 — mint & attenuate
[[steps]]
name = "milestone_2"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0

# Milestone 3 — third-party caveats
[[steps]]
name = "milestone_3"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0

# Milestone 4 — forge
[[steps]]
name = "milestone_4"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0
