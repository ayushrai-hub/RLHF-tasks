# Audit contract for the exhibit signing kiosk.
# Defines the fixed inputs, output locations, and verification conventions used by
# the media signature audit library. Values here are configuration, not procedure.

[suite]
name = "exhibit-signing-audit"
revision = "2026-Q2"

[database]
path = "/app/data/exhibit_signing.db"
separator = "|"

[time]
audit_time = "2026-06-01T00:00:00Z"
canonical_format = "%Y-%m-%dT%H:%M:%SZ"

[registry]
# The live Trust Registry that holds the authoritative current key state.
base_url = "http://127.0.0.1:7681"
start_cursor = "p1"

[keys]
fingerprint_digest = "sha256"
fingerprint_encoding = "hex-lower"
prehash_algorithms = ["rsa", "ec"]
rawin_algorithms = ["ed25519"]

[manifest]
version = "exhibit-manifest/v1"
content_digest = "sha256"

[signatures]
encoding = "base64"

[revocation]
# Revocation reasons that void a key's signatures retroactively.
retroactive_reasons = ["key_compromise", "ca_compromise", "key_expunged"]

[outputs.signing_catalog]
path = "/app/output/signing_catalog.json"
schema = "/app/config/schemas/signing_catalog.schema.json"

[outputs.signature_evidence]
path = "/app/output/signature_evidence.json"
schema = "/app/config/schemas/signature_evidence.schema.json"

[outputs.remediation_report]
path = "/app/output/remediation_report.json"
schema = "/app/config/schemas/remediation_report.schema.json"
