difficulty_explanation = "The task requires globally optimal settlement under unitized balances, forbidden payer/payee pairs, per-group GX1 corridor tokens, GL1 parallel settlement lanes, potentially negative adjusted per-unit fees, and a deterministic first-unit rebate per used pair. The verifier generates nontrivial ledgers with nonstandard participant IDs and group names, dense route controls, discount lanes, rebate-sensitive optima, malformed tokens, and infeasible rules. Greedy, same-group-first, fixture-specific, old min-cost-flow, or transfer-list brute-force approaches fail; agents need a robust optimizer over unit-expanded lane costs with negative residual costs."
solution_explanation = "The reference solution decodes and validates GX1 and GL1 tokens, expands each allowed debtor/creditor pair into sorted unit-cost lanes with the one-time first-unit rebate applied, runs min-cost flow, aggregates positive unit flows into sorted JSON transfers, and exits nonzero on malformed tokens, invalid units, unbalanced ledgers, or infeasible exact settlement."
verification_explanation = "The tests rebuild the Go program, run it on two bundled ledgers and four generated adversarial ledgers, independently recompute the min-cost-flow optimum with rebate-adjusted unit costs, verify exact settlement invariants, sorted unique payer/payee output, forbidden pairs, lane capacity and cheapest-lane fee accounting, and require nonzero exits for malformed-token and infeasible-rule inputs."

