version = "1.1"

[metadata]
author_name = "Terminal-Bench Team"
author_email = "contact@terminal-bench.org"
license = "Apache-2.0"
created_date = "2025-12-25"
modified_date = "2025-12-26"

difficulty = "intermediate"
category = "debugging"
tags = ["python", "cli", "parsing", "file-io", "error-handling"]

# Time estimates in minutes
expert_time_estimate_min = 20.0
intermediate_time_estimate_min = 45.0
junior_time_estimate_min = 90.0

# Dependencies
[metadata.dependencies]
python = ">=3.13.0,<3.14"

# Task description
[metadata.description]
short = "Fix a buggy CLI tool that sums integers from a file"
long = """
The task involves debugging and fixing a Python command-line tool that reads integers from a file and prints their sum. 
The program must handle various edge cases including large files, invalid input, and system errors.
"""

# Verification settings
[verifier]
timeout_sec = 120.0  # Increased for large file tests
max_output_size_mb = 10

# Agent execution limits
[agent]
timeout_sec = 300.0  # 5 minutes
max_memory_mb = 256   # Limit agent memory usage
max_output_size_mb = 1
max_file_size_mb = 10

# Environment configuration
[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240  # Increased for large file tests
readonly = true     # Prevent file system modifications
network = false     # Disable network access

# Resource monitoring
[monitoring]
enable = true
check_interval_sec = 5
max_cpu_percent = 90
max_memory_percent = 90

# Security constraints
[security]
allow_network = false
allow_process_spawn = false
allow_write_access = [
    "/tmp",
    "/app/output"
]

# Test configuration
[test]
include = ["test_*.py"]
require_code_coverage = true
min_coverage_percent = 90

# Linting configuration
[lint]
enable = true
python_version = "3.13"
ignore = [
    "E501",  # Line too long
    "W503",  # Line break before binary operator
]
