[package]
name = "k7_replay"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "k7_invoke"
path = "cli/k7_invoke.rs"

[[bin]]
name = "k7_z2"
path = "cli/k7_z2.rs"

[[bin]]
name = "k7_recover"
path = "cli/k7_recover.rs"

[dependencies]
crc32fast = "=1.4.2"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
