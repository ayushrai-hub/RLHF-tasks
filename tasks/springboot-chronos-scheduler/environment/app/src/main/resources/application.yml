server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: chronos
  datasource:
    url: jdbc:h2:file:/app/data/chronos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: chronos
    password: chronos
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
  sql:
    init:
      mode: always
      schema-locations: file:/app/schema.sql
      continue-on-error: false

chronos:
  workers: 4
  scheduler:
    poll-interval-ms: 1000
  heartbeat:
    interval-ms: 1000
    timeout-ms: 10000
    max-recovery-attempts: 3
  misfire:
    threshold-seconds: 60

logging:
  level:
    root: INFO
    com.snorkel.chronos: INFO
    org.springframework: WARN
