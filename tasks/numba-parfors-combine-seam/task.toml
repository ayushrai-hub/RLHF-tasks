version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "scientific-computing"
tags = ["numba-style", "parfors-reduction", "dtype-promote", "combine-seam", "numeric-policy", "replay"]
languages = ["rust", "bash"]
codebase_size = "small"
number_of_milestones = 0
subcategories = ["tool_specific"]
expert_time_estimate_min = 75
junior_time_estimate_min = 240

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 900

[environment]
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = false
user_visible_outputs = ["/app/output/r8_trace.json"]
internal_harness_files = []

[structured_outputs.r8_trace]
target = "/app/output/r8_trace.json"
format = "json"
instruction_checks = [
    "epochs",
    "body_digest",
]
